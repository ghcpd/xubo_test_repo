<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>十二生肖 Zodiac</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeOutDown: {
                '0%': { opacity: '1', transform: 'translateY(0)' },
                '100%': { opacity: '0', transform: 'translateY(10px)' },
              },
            },
            animation: {
              fadeInUp: 'fadeInUp 200ms ease-out',
              fadeOutDown: 'fadeOutDown 200ms ease-in',
            },
          }
        }
      }
    }
  </script>
  <style>
    /* Minimal fallback styles in case Tailwind CDN is blocked */
    #zodiac-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    @media (min-width: 640px) { #zodiac-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 768px) { #zodiac-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (min-width: 1024px) { #zodiac-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
    #modal-backdrop.hidden { display: none; }

    @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(10px);} 100% { opacity: 1; transform: translateY(0);} }
    @keyframes fadeOutDown { 0% { opacity: 1; transform: translateY(0);} 100% { opacity: 0; transform: translateY(10px);} }
    .animate-fadeInUp { animation: fadeInUp 200ms ease-out; }
    .animate-fadeOutDown { animation: fadeOutDown 200ms ease-in; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-rose-50 via-amber-50 to-emerald-50 text-gray-800">
  <header class="max-w-6xl mx-auto p-4 md:p-6 flex items-center justify-between">
    <h1 id="app-title" class="text-2xl md:text-3xl font-bold">十二生肖</h1>
    <button id="lang-toggle" class="px-4 py-2 rounded-full bg-indigo-600 text-white shadow hover:bg-indigo-500 active:scale-95 transition">
      EN
    </button>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6">
    <p id="app-description" class="mb-4 text-sm md:text-base text-gray-600">
      点击任意生肖查看详情。
    </p>

    <section id="zodiac-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></section>
  </main>

  <!-- Modal -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/50 hidden items-end md:items-center justify-center">
    <div id="modal" class="w-full md:w-[480px] rounded-t-2xl md:rounded-2xl bg-white shadow-xl p-4 md:p-6 translate-y-4 md:translate-y-0 opacity-0">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 id="modal-title" class="text-xl md:text-2xl font-semibold">生肖</h2>
          <p id="modal-subtitle" class="text-sm text-gray-500">Zodiac</p>
        </div>
        <button id="modal-close" class="p-2 rounded-full hover:bg-gray-100 active:scale-95 transition">
          <span aria-hidden="true">✕</span>
        </button>
      </div>
      <div class="mt-4 space-y-2">
        <p class="text-sm text-gray-600"><span id="label-year" class="font-medium">年份：</span><span id="modal-year-range"></span></p>
        <p class="text-sm text-gray-600"><span id="label-traits" class="font-medium">性格：</span><span id="modal-traits"></span></p>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
